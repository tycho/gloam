# @generated by gloam.
[package]
name = "gloam_vk"
version = "0.0.0"
edition = "2021"
# c"..." literals need 1.77; core::error::Error needs 1.81.
rust-version = "1.81"

[features]
default = ["alloc"]
# Analogue of a KHR_no_error GL context, applied at compile time:
# removes the per-call is-loaded check, so calling an unloaded
# function is undefined behavior (as in C) instead of a panic.
no-error = []
# Heap-using conveniences: Vulkan's discover() needs enumeration
# buffers.  Disable (default-features = false) for allocator-free
# builds; the phased loaders never allocate.
alloc = []
# Platform-windowing surface opt-ins, mirroring the C headers'
# VK_USE_PLATFORM_* defines.
VK_ENABLE_BETA_EXTENSIONS = []
VK_USE_PLATFORM_ANDROID_KHR = []
VK_USE_PLATFORM_DIRECTFB_EXT = []
VK_USE_PLATFORM_FUCHSIA = []
VK_USE_PLATFORM_GGP = []
VK_USE_PLATFORM_IOS_MVK = []
VK_USE_PLATFORM_MACOS_MVK = []
VK_USE_PLATFORM_METAL_EXT = []
VK_USE_PLATFORM_OHOS = []
VK_USE_PLATFORM_SCI = []
VK_USE_PLATFORM_SCREEN_QNX = []
VK_USE_PLATFORM_UBM_SEC = []
VK_USE_PLATFORM_VI_NN = []
VK_USE_PLATFORM_WAYLAND_KHR = []
VK_USE_PLATFORM_WIN32_KHR = []
VK_USE_PLATFORM_XCB_KHR = []
VK_USE_PLATFORM_XLIB_KHR = []

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }
